<!doctype html>
<html lang="pt-BR">
<head>
{{HEAD}}
</head>
<body>
{{TOP}}
<main>

  <section class="quem dark" id="quem-somos">
    <div class="quem__fundo" aria-hidden="true">{{IMG_QUEM}}</div>
    <div class="quem__palco">
      <div class="wrap quem__in">
        <h1>Quem somos</h1>
        <p class="manifesto" data-manifesto>{{MANIFESTO}}</p>
      </div>
    </div>
  </section>

  <section class="banda dark" aria-labelledby="banda-titulo">
    <div class="banda__img" data-parallax>{{IMG_BANDA}}</div>
    <div class="wrap banda__in">
      <h2 class="rv" id="banda-titulo">Do apartamento da construtora ao lar pronto para morar.</h2>
    </div>
  </section>

  <section class="sec porque" id="como-trabalhamos">
    <div class="wrap">
      <h2 class="rv">Como a Reformuli trabalha</h2>
      <div class="porque__grade">
        {{PORQUE}}
      </div>
      <div class="ctas ctas--centro rv">
        <a class="btn btn--pri" href="/#simulador">Simular minha reforma {{ARROW}}</a>
        <a class="btn btn--line" href="/#contato">Fale com a gente</a>
      </div>
    </div>
  </section>

</main>
{{FOOT}}
</body>
</html>
